      alpha: 允许凪以高风险高压方式物理突进并强制切断“节目效果”来源
      beta: 允许凪短暂周旋与拆解心理战，但不得放弃摧毁观众幻觉机制
      sceneProgress: 凪已进入灰谷烈直播据点核心，节目效果与现实攻击开始崩塌到同一平面
    roundState:
      phaseGoal: 在持续高压中摧毁灰谷烈的观众幻觉与直播异能来源
