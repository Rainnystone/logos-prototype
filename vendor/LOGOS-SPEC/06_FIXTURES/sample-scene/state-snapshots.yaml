    purpose: 终局收尾，灰谷烈已失去节目效果支撑，系统需要完成击倒与表面回归。
    sceneState:
      sceneId: sample-yanshang-live-room
      currentPhaseIndex: 6
      currentBeatIndexInPhase: 4
      mainAxis: 日常教室突发路人手机自燃事件 -> 雾间凪暗中脱离教室追踪信号源 -> 遭遇灰谷烈的电子陷阱与初见交锋 -> 突入并锁定灰谷烈的直播据点 -> 识破并切断其直播观众来源 -> 物理击溃反派并回归日常
      endLine: 灰谷烈的直播间观众被彻底清零，其肉体被雾间凪彻底击倒，学校恢复表面的平静，宫下藤花对刚才的致命危机一无所知
      alpha: 允许凪进行最后的物理压制与现场处理，但不得制造新的异常扩散
      beta: 允许凪谨慎收尾与确认目标失能，但不得让灰谷烈重新取得行动能力
      sceneProgress: 敌人的节目效果已被摧毁，终局只剩最后的肉体击倒与痕迹清理
