          content: 灰谷烈通过广播与屏幕对凪进行表演式挑衅，试图把她纳入节目叙事。
        - role: user
          content: 强行突入据点，确认环境中存在伪造观众反馈。
        - role: assistant
          content: 交锋中灰谷烈不断对空气解说，试图把凪当成节目素材，但凪已逼近其异能核心。
      directorConstraints: 必须维持持续高压，选项应围绕切断观众来源与压制反派展开
    generationState:
      directorNoteSummary: 这一轮必须像慢镜头般高压推进，并把“社会性死亡”机制推到前景
      promptObject: {}
