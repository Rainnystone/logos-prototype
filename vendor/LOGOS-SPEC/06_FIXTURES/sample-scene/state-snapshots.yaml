sceneId: sample-yanshang-live-room
description: >
  供 sample-scene 使用的参考状态快照集合。每个快照都对应一个典型阶段位置，
  用来帮助后续实现和测试理解系统在不同节点应该携带怎样的最小状态。
snapshots:
  - snapshotId: ss-phase01-beat01
    purpose: 开场序章，日常尚未断裂，但异常预感已经开始积聚。
    sceneState:
      sceneId: sample-yanshang-live-room
      currentPhaseIndex: 1
      currentBeatIndexInPhase: 1
      mainAxis: 日常教室突发路人手机自燃事件 -> 雾间凪暗中脱离教室追踪信号源 -> 遭遇灰谷烈的电子陷阱与初见交锋 -> 突入并锁定灰谷烈的直播据点 -> 识破并切断其直播观众来源 -> 物理击溃反派并回归日常
      endLine: 灰谷烈的直播间观众被彻底清零，其肉体被雾间凪彻底击倒，学校恢复表面的平静，宫下藤花对刚才的致命危机一无所知
      alpha: 允许雾间凪快速进入异常追踪状态，但不得让藤花暴露于危机中心
      beta: 允许雾间凪暂时旁观与判断，但不得因拖延而错失事件起点
      sceneProgress: 日常表层仍然完整，异常尚处于前奏阶段
    roundState:
      phaseGoal: 展现平静校园日常并铺设第一波异常
      currentVolume: Low
      currentRouter: 日常/闲暇
      verbLexicon:
        - 闲散
        - 漫谈
        - 介入
        - 独处
      historyWindow: []
      directorConstraints: 强调日常纯度与藤花的安全，不提前泄露完整敌情
    generationState:
      directorNoteSummary: 开场镜头必须冷静克制，先建立日常锚点，再逐步露出异常征兆
      promptObject: {}
      currentBeatText: null
      currentOptions: []
    evaluationState:
      auditAnswers: []
      blockingFailures: []
      retryCount: 0
      rewriteFeedback: null

  - snapshotId: ss-phase02-beat02
    purpose: 逆向追踪阶段中段，凪已经离开教室并开始勘查异常信号。
    sceneState:
      sceneId: sample-yanshang-live-room
      currentPhaseIndex: 2
      currentBeatIndexInPhase: 2
      mainAxis: 日常教室突发路人手机自燃事件 -> 雾间凪暗中脱离教室追踪信号源 -> 遭遇灰谷烈的电子陷阱与初见交锋 -> 突入并锁定灰谷烈的直播据点 -> 识破并切断其直播观众来源 -> 物理击溃反派并回归日常
      endLine: 灰谷烈的直播间观众被彻底清零，其肉体被雾间凪彻底击倒，学校恢复表面的平静，宫下藤花对刚才的致命危机一无所知
      alpha: 允许凪主动干预设备、冒险勘查与快速推进，但不得直接提前找到终局据点
      beta: 允许凪谨慎潜行与逻辑推演，但不得退回教室恢复日常
      phaseConsequences:
        - 路人学生手机自燃事件已发生，教室陷入短暂恐慌后恢复表面秩序
        - 雾间凪已借混乱脱离教室，开始独立追踪异常信号源
        - 宫下藤花仍留在教室内，对异常事件的真实性质一无所知
        - 校园走廊与广播系统中检测到电子噪声残留，异常范围初步收缩
      sceneProgress: 凪已经确认异常不是偶发事故，而是带有指向性的外部操控
    roundState:
      phaseGoal: 在校园内逆向追踪“炎上”异能的信号源
      currentVolume: Med
      currentRouter: 悬疑/探案
      verbLexicon:
        - 勘查
        - 演绎
        - 潜伏
        - 干预
      historyWindow:
        - role: assistant
          content: 路人学生手机突然发出异常高频蜂鸣并爆炸，教室陷入短暂恐慌。
        - role: user
          content: 趁混乱脱离教室，追踪异常信号源。
        - role: assistant
          content: 雾间凪借混乱脱离教室，在走廊与广播死角发现电子噪声残留。
      directorConstraints: 保持追踪逻辑清楚，不要提前转成纯战斗段
    generationState:
      directorNoteSummary: 当前轮应强调勘查、线索比对与校园空间中的异常痕迹
      promptObject: {}
      currentBeatText: null
      currentOptions: []
    evaluationState:
