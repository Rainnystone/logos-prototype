  - snapshotId: ss-phase05-beat03
    purpose: 高潮阶段后段，凪已经逼近灰谷烈异能来源，必须执行破局动作。
    sceneState:
      sceneId: sample-yanshang-live-room
      currentPhaseIndex: 5
      currentBeatIndexInPhase: 3
      mainAxis: 日常教室突发路人手机自燃事件 -> 雾间凪暗中脱离教室追踪信号源 -> 遭遇灰谷烈的电子陷阱与初见交锋 -> 突入并锁定灰谷烈的直播据点 -> 识破并切断其直播观众来源 -> 物理击溃反派并回归日常
