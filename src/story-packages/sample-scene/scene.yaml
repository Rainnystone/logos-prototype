sceneId: sample-yanshang-live-room
sceneName: 炎上直播间
source: LOGOS-SPEC/06_FIXTURES/sample-scene/scene-overview.md
samplePurpose: 验证 LOGOS 在单 Scene、6 Phase、固定 4 Beat Phase 条件下的控制闭环是否稳定，并测试“轻小说本格”文风下的日常/异常切换控制
mainAxis: 日常教室突发路人手机自燃事件 -> 雾间凪暗中脱离教室追踪异常信号源 -> 遭遇灰谷烈的电子陷阱与初见交锋 -> 突入并锁定灰谷烈的直播据点 -> 识破其机制并切断直播观众来源 -> 物理击溃反派并回归日常
endLine: 灰谷烈的直播间观众被彻底清零（社会性死亡），其肉体被雾间凪以物理手段彻底击倒；学校恢复表面的平静；宫下藤花全程对刚才的致命危机一无所知
openingHook: >-
  午后的深阳高中教室内，气氛沉闷而安宁。宫下藤花正在前排认真做笔记，而在教室后排，雾间凪敏锐地察觉到空气中不自然的焦躁感。突然，邻座一名普通学生的手机在毫无征兆的情况下发出刺耳的过载蜂鸣，屏幕瞬间爆裂，甚至连带引燃了课桌上的书本。在众人的惊呼与混乱中，唯有雾间凪捕捉到了某种常人无法察觉的“恶意信号”，她以去医务室为借口，冷着脸翻出了窗户，切入异常的暗面。
