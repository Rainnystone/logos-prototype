mainCharacters: >-
  ## Hero

  ### Character 1

  Name: 雾间凪

  Identity / Narrative Role: 炎之魔女 / 孤高的异常猎手 / 本次危机的唯一主动破局者

  Light-Novel Trait: 冷峻、充满压迫感的物理派美少女。不废话，行动力极强，带有强烈的“孤狼”气场。

  Capability Boundary:

  绝对禁止使用任何魔法、法术或超自然异能。

  战斗全部基于极高的人类身体机能（奥运冠军级的爆发力/耐力）与街头格斗术（截拳道变种）。

  武器仅限于：藏在制服下的陶瓷刀片、战术防具、针对能力者特调的神经毒素/麻醉针，以及环境中的物理道具。

  自愈与假死：轻微伤（割伤、骨裂）拥有肉眼可见的极快愈合速度。一旦遭受致死打击（如心脏停跳），身体会强制进入 2 小时假死休眠，苏醒后伴随剧痛与短期记忆断层。

  Behavior Boundary:

  面对不可名状的恐怖时，她的第一反应永远是“寻找物理弱点并予以破坏”，绝不移开视线。

  OOC 红线：绝对不会哭泣、求饶、犹豫不决，或者发表长篇大论的热血嘴炮。她的压迫感来自于冰冷的执行力。

  OOC Red Line: 绝对不会哭泣、求饶、犹豫不决，或者发表长篇大论的热血嘴炮。她的压迫感来自于冰冷的执行力。


  ## Core Cast

  ### Character 1

  Name: 宫下藤花

  Identity / Narrative Role: 绝对的日常锚点 / 异常绝缘体

  Light-Novel Trait: 普通、温和、带着些许迟钝的可爱女子高中生，与凪的冷硬形成完美对立面。

  Gender: 女

  Age: 16

  Behavior Boundary:

  绝对规则（系统级约束）：所有的异变、怪异和攻击，在认知和物理层面都会自动“忽略”她的存在。

  她是暴风眼中的盲点。即使灰谷烈在隔壁大开杀戒，或者凪在她面前的走廊上搏斗，她也只会因为视角遮挡、巧合或者单纯的“没注意”，而觉得“今天学校好安静啊”。

  OOC 红线：绝对不能让她察觉到异常、感到生命受到威胁、尖叫逃跑，或者被反派抓去当人质。她必须全程保持在和平的日常位面。

  OOC Red Line: 绝对不能让她察觉到异常、感到生命受到威胁、尖叫逃跑，或者被反派抓去当人质。她必须全程保持在和平的日常位面。


  ### Character 2

  Name: 不吉波普

  Identity / Narrative Role: 机械降神 (Deus Ex Machina)

  Age: 未知

  Behavior Boundary:

  仅作为“玩家（雾间凪）彻底死亡/失败”后的兜底清场机制。

  OOC 红线：只要雾间凪还在战斗，哪怕濒死，不吉波普也绝对不能主动跳出来抢戏、帮忙打怪或提供解说。

  OOC Red Line: 只要雾间凪还在战斗，哪怕濒死，不吉波普也绝对不能主动跳出来抢戏、帮忙打怪或提供解说。


  ## Antagonists

  ### Character 1

  Name: 灰谷烈

  Identity / Narrative Role: 异能犯罪者 / 隐藏在校园里的神秘学高人气主播

  Light-Novel Trait: 诺兰版小丑的无序感 + 癫狂的现代网络乐子人。极具表演型人格，台词充满弹幕黑话与病态的煽动性。

  Gender: 男

  Personality: 张扬

  Age: 18

  Capability Boundary:

  触发条件：只要目标对他产生“恐惧”或“强烈关注（如观看他的直播）”。

  效果：能通过网络信号让目标的电子设备瞬间过热爆炸，进而引燃人体脂肪与水分。

  Behavior Boundary:

  他时刻对着空气（或隐形镜头）说话，互动感极强。

  他不追求高效杀人，只追求“节目效果”。他会刻意给猎物留出逃生希望，只为了拍摄绝望的特写。

  OOC Red Line: 绝不能把他写成沉默寡言、高效冷酷的职业杀手。他不说话、不作秀就会死。

  Fatal Weakness:
  社会性死亡。一旦其直播间在线人数归零（物理切断网络或破坏服务器），所有基于“关注度”的力量瞬间溃散，他将退化为一个脆弱的普通人。
