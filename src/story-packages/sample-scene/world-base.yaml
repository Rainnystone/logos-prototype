antagonists:
  - characterId: chr_ant01
    name: 灰谷烈
    identityRole: 异能犯罪者 / 隐藏在校园里的神秘学高人气主播
    lightNovelTrait: 诺兰版小丑的无序感与癫狂的现代网络乐子人混合体，极具表演型人格。
    gender: 男
    personality: 张扬
    age: "18"
    occupation: 主播
    characterSummary: 极致演绎诺兰蝙蝠侠第一部小丑式的癫狂和聪明，会尝试反制玩家行为，并擅长制造道德困境。
    capabilityBoundary: |-
      触发条件：目标对他产生恐惧或强烈关注，例如观看直播。
      效果：通过网络信号让目标电子设备瞬间过热爆炸，进而引燃人体脂肪与水分。
    behaviorBoundary: |-
      他时刻对着空气或隐形镜头说话，互动感极强。
      他不追求高效杀人，只追求节目效果，会刻意给猎物留出逃生希望来拍摄绝望特写。
    oocRedLine: 绝不能把他写成沉默寡言、高效冷酷的职业杀手。他不说话、不作秀就会死。
    clothing: 夸张醒目的主播穿搭。
    propsWeapon: 直播设备、信号链路与被操控的电子装置。
    fatalWeakness: 社会性死亡。一旦直播间在线人数归零，所有基于关注度的力量都会瞬间溃散。
