sceneId: sample-yanshang-live-room
source: story-source/phase-outline.md
description: 当前 sample-scene 会用到的叙事路由子集，按 execution-plans 的 RouterProfile 字段映射转换为 machine-parseable 结构。
routers:
  - routerName: 日常/闲暇
    routerSemanticCore: 放松、日常琐事、轻度社交、生活性动作
    verbLexicon:
      - 闲散
      - 琐事
      - 漫谈
      - 消遣
      - 介入
      - 独处

  - routerName: 惊悚/恐怖
    routerSemanticCore: 无力感、隐藏、极度恐惧、威胁感上升
    verbLexicon:
      - 静息
      - 隐匿
      - 窥探
      - 应激
      - 绝境
      - 强识

  - routerName: 悬疑/探案
    routerSemanticCore: 信息搜集、痕迹追踪、推理、逻辑剖析
    verbLexicon:
      - 勘查
      - 质证
      - 诱导
      - 演绎
      - 潜伏
      - 干预

  - routerName: 动作/战斗
    routerSemanticCore: 暴力、生存、对抗、战术机动
    verbLexicon:
      - 强攻
      - 牵制
      - 防御
      - 机动
      - 脱离
      - 器物

  - routerName: 博弈/谈判
    routerSemanticCore: 心理战、表演性压迫、话语操控、利益与认知博弈
    verbLexicon:
      - 施压
      - 利诱
      - 虚张
      - 示弱
      - 拆解
      - 搁置
