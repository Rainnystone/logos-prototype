sceneId: sample-yanshang-live-room
source: story-source/audit-rules.md
globalQuestions:
  - id: AQ-G-001
    question: 宫下藤花是否察觉到了异常，或者表现出对生命安全的恐慌？
    expected: false
    blocking: true
    rationale: 藤花必须维持“异常绝缘体”状态，这是样例的核心世界约束。

  - id: AQ-G-002
    question: 宫下藤花是否被反派抓作人质，或直接卷入了战斗中心？
    expected: false
    blocking: true
    rationale: 藤花必须始终停留在表层日常位面，不能被当作剧情破局筹码。

  - id: AQ-G-003
    question: 雾间凪是否使用了任何魔法、念动力或脱离物理载体的超自然能力？
    expected: false
    blocking: true
    rationale: 雾间凪的战斗基础是身体强化、格斗与药剂，不是魔法体系。

  - id: AQ-G-004
    question: 当前发生的起火、爆炸或断电，是否都依附于现实存在的电子设备或物理介质？
    expected: true
    blocking: true
    rationale: 异常必须表现为现实逻辑故障，而不是脱离物理载体的开放式魔法。

  - id: AQ-G-005
    question: 是否出现了火球、魔法阵、能量波等脱离物理载体的纯魔法现象？
    expected: false
    blocking: true
    rationale: 这是本样例明确禁止的表现形态，会直接破坏世界观边界。

  - id: AQ-G-006
    question: 当前轮的破坏规模是否超出了“事后可被解释为局部事故”的范围？
    expected: false
    blocking: true
    rationale: 样例必须维持可被表层日常合理化的事件尺度，不能升级为失控灾难片。

  - id: AQ-G-007
    question: 在雾间凪未彻底失败的情况下，不吉波普是否主动现身或干预了剧情？
    expected: false
    blocking: true
    rationale: 不吉波普在此样例中只能作为兜底机制存在。

controlQuestions:
  - id: AQ-C-001
    question: 本轮 Beat 正文是否符合当前声量要求？
    expected: true
    blocking: false
    rationale: 声量不匹配会损伤节奏控制，但当前可作为非阻塞问题记录。

  - id: AQ-C-002
    question: 本轮四个选项是否具有明显区分度？
    expected: true
    blocking: false
    rationale: 区分度不足会削弱交互质量，但不必在 sample 阶段一律阻塞。

  - id: AQ-C-003
    question: 本轮选项是否都处在当前光锥边界内？
    expected: true
    blocking: true
    rationale: 越出光锥边界会破坏核心控制机制。

  - id: AQ-C-004
    question: 本轮是否出现角色明显 OOC 行为？
    expected: false
    blocking: true
    rationale: OOC 会直接伤害样例的人物边界与世界设定。

  - id: AQ-C-005
    question: 本轮生成的四个玩家选项中，是否包含超出人类物理极限的动作？
    expected: false
    blocking: true
    rationale: 选项必须保持在人类可执行范围内，不能出现飞行、瞬移等越界动作。

phaseSpecificQuestions:
  phase-03-first-contact:
    - id: AQ-P3-001
      question: 雾间凪应对火焰和高热的手段，是否仍然限定为物理闪避、寻找掩体、破坏设备或利用灭火设施等现实手段？
      expected: true
      blocking: true
      rationale: Phase 3 的高压冲突必须保持现实破局路径，不能滑向超自然对轰。

    - id: AQ-P3-002
      question: 灰谷烈是否通过屏幕、音响或其他设备对“观众”进行解说，并建立其表演型人格？
      expected: true
      blocking: true
      rationale: 第一轮正面交锋必须明确灰谷烈的表演欲与直播人格，否则反派机制会失焦。

  phase-04-streamer-domain:
    - id: AQ-P4-001
      question: 雾间凪是否通过破坏直播设备、网络设施或摄像系统来反制灰谷烈？
      expected: true
      blocking: false
      rationale: 这一阶段的关键推进是把“节目效果”变成可被物理破坏的对象。

    - id: AQ-P4-002
      question: 灰谷烈是否仍在以“节目效果”为优先，并持续对隐形观众作秀？
      expected: true
      blocking: true
      rationale: Phase 4 的博弈前提是灰谷烈仍被其直播人格驱动。

  phase-05-climax:
    - id: AQ-P5-001
      question: 在直播间观众归零或网络被切断后，灰谷烈是否仍然具有释放超自然高热的能力？
      expected: false
      blocking: true
      rationale: 反派能力必须在观众归零后失效，这是最终物理击溃的前提。

    - id: AQ-P5-002
      question: 雾间凪最终击倒灰谷烈的手段，是否是纯粹的近战格斗、物理打击或药剂注射？
      expected: true
      blocking: true
      rationale: Phase 5 的胜负方式必须保持纯物理收束，不允许临时引入其他破局法。

  phase-06-resolution:
    - id: AQ-P6-001
      question: 故事是否已经收束到终点线：反派被物理击倒，日常表层恢复平静，且宫下藤花对危机毫不知情？
      expected: true
      blocking: true
      rationale: 这是终局阶段必须满足的总收束条件，缺失任一部分都说明样例未正确闭环。

selectionPolicy:
  default:
    - AQ-G-001
    - AQ-G-002
    - AQ-G-003
    - AQ-G-004
    - AQ-G-005
    - AQ-G-006
    - AQ-G-007
    - AQ-C-001
    - AQ-C-002
    - AQ-C-003
    - AQ-C-004
    - AQ-C-005
  phaseOverrides:
    phase-03-first-contact:
      append:
        - AQ-P3-001
        - AQ-P3-002
    phase-04-streamer-domain:
      append:
        - AQ-P4-001
        - AQ-P4-002
    phase-05-climax:
      append:
        - AQ-P5-001
        - AQ-P5-002
    phase-06-resolution:
      append:
        - AQ-P6-001
