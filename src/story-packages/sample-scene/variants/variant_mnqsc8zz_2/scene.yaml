openingSituation: 午后的校园仍维持表层日常，但走廊和教室附近已经出现不合常理的过热迹象，雾间凪必须在不惊动普通学生的前提下先判断异常来自何处。
openingHook: 午后的深阳高中教室内，气氛沉闷而安宁。宫下藤花正在前排认真做笔记，而在教室后排，雾间凪留意到空气里那种不合时宜的躁动。突然，邻座一名普通学生的手机在毫无征兆的情况下发出刺耳的过载蜂鸣，屏幕瞬间爆裂，甚至连带引燃了课桌上的书本。在众人的惊呼与混乱中，雾间凪没有立刻得到完整敌情，只从异常的过载痕迹和被刻意放大的骚动里判断这不是普通事故，并开始一步步查清幕后操控者。
