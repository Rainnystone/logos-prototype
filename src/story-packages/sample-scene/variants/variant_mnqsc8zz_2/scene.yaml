startPoint: 日常教室突发路人手机自燃事件
mainAxis: 日常教室突发路人手机自燃事件 ->
  建立校园日常的基调，随后用突发的手机自燃事件打破平静；雾间凪察觉异常并脱离日常表层，而宫下藤花保持无知。雾间凪此时并不知道灰谷烈的存在，引导雾间凪逐步探索并发现灰谷烈的存在，但并无机会当面对峙。
  -> 雾间凪在走廊与校园中追踪异常信号，避开人群，发现灰谷烈布置的初步电子陷阱或被操控的痕迹。 ->
  凪突入废弃视听室并遭遇灰谷烈；反派通过屏幕与音响宣告“直播开始”，并利用室内设备发动第一波炎上攻击。 ->
  凪看穿“炎上”机制依托于直播观众的关注度与恐惧感，并以破坏直播设备的方式进行反向压制。 ->
  观众人数归零后，“炎上”异能彻底失效；凪近身并以纯粹的物理手段将灰谷烈彻底击倒。 ->
  战斗结束后清理现场，凪回到日常线并与宫下藤花重新交汇，确认表里世界的隔离机制仍然成立。 ->
  灰谷烈的直播间观众被彻底清零（社会性死亡），其肉体被雾间凪以物理手段彻底击倒；学校恢复表面的平静；宫下藤花全程对刚才的致命危机一无所知.
endLine: 灰谷烈的直播间观众被彻底清零（社会性死亡），其肉体被雾间凪以物理手段彻底击倒；学校恢复表面的平静；宫下藤花全程对刚才的致命危机一无所知.
