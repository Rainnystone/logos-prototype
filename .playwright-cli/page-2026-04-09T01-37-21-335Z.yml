                    - generic [ref=e255]: 前往旧校舍废弃视听室进行初步侦察
                  - paragraph [ref=e256]: 你从混乱的教室中抽身而出，脚步平稳地汇入走廊的人流。午后的阳光在走廊地板上切出明暗交错的光带，但当你越是靠近旧校舍的方向，空气里那种不协调的躁动就愈发明显。墙壁上的电子公告牌原本应该显示着下周的考试安排，此刻却浮出细密的雪花屏，像是有无形的信号在干扰着它的正常运转。 你放慢了脚步。 指尖掠过走廊的金属扶手，触感异常温热——这不应该。深秋的午后，金属本该带着凉意，但这里的温度明显比教学楼主体高出几度。你抬起头，看见头顶的监控探头间歇性地发出过载的电流声，镜头微微颤抖，红色的指示灯以一种不自然的频率急促闪烁。 你拐进通往旧校舍的连廊。 这里的行人骤然减少。大部分学生都在主教学楼活动，旧校舍因为设备老化而逐渐废弃，只有偶尔会有人来这里寻找安静的角落。你的脚步声在空旷的走廊里回响，每一步都经过刻意的控制，既不会太快引起注意，也不会太慢浪费时间。 焦糊味开始渗入鼻腔。 不是刚才教室里那种塑料燃烧的刺鼻气味，而是一种更复杂的混合——臭氧的尖锐、硅胶长时间高温工作后的沉闷，还有某种电子设备散热风扇持续轰鸣产生的金属热度。你的探测器在制服口袋里发出轻微的震动，屏幕上的数值正在攀升。 你停在废弃视听室的门前。 这扇门看起来和其他废弃教室没什么两样，门上的玻璃观察窗被从内部贴上了黑色的遮光膜，看不清里面的情况。但你的注意力被门缝下方吸引——那里有一缕几乎不可见的热气在扭曲空气，就像盛夏柏油路面上的热浪。门把手上积了一层薄灰，但灰尘上有新鲜的指印痕迹，而且是多次开合留下的磨损。 有人经常使用这里。 你贴着墙根移动，绕到视听室的侧面。这里的窗户同样被遮蔽，但你注意到窗框边缘的密封胶条有被动过的痕迹，似乎是被人为地改造过以增强隔音效果。从缝隙中渗出的光线不是自然的日光，而是一种幽暗的、不断闪烁的冷色调——那是多台显示器同时工作才会产生的光污染。 你听到了声音。 极其细微，但逃不过你经过强化的听觉。那是散热风扇的轰鸣，夹杂着键盘敲击的脆响，还有——你眯起眼睛——某种像是人在低声絮语的声音，断断续续，带着一种表演性质的抑扬顿挫。不是对话，更像是独白，或者说……解说。 你的背脊微微绷紧。 这不是普通的废弃教室。有人在把这里改造成某种据点，而且就在最近。你回想起教室里那台自燃的手机，那种被远程触发的过载模式，还有信号追踪指向这里的轨迹。所有的线索都在指向这扇门后的空间，但你还没有看到幕后者的真面目。 你需要更多的情报。 你蹲下身，从制服内袋取出一枚微型光纤探头——这是你从黑市渠道获得的侦查工具，前端带有微型摄像头，可以通过门缝或缝隙进行视觉侦查。你的动作精准而迅速，没有任何多余的声响。探头穿过门缝底部的缝隙，你通过连接的便携屏幕观察内部。 画面里是堆满电子设备的狭窄空间。 盘根错节的线缆像藤蔓一样爬满墙壁和地板，多台主机散热排风口对着天花板喷吐热浪，废弃的电子元件散落在角落。中央位置有一把被改造过的电竞椅，椅背朝向门口，上面坐着一个人影，只能看到背影。那人正对着一排显示器说话，手势夸张，头部戴着专业的直播耳机。 你看到了屏幕的反光。 那上面滚动着密集的弹幕文字，像瀑布一样倾泻而下。虽然看不清具体内容，但那种实时互动的界面你认得——这是某个直播平台的界面。而那个背影正在对着 invisible 的观众表演，声音透过隔音门变得模糊，但那种癫狂的语调依然能渗透出来。 你的探测器突然发出一声尖锐的警报，随即被你迅速按住。 屏幕上的数值爆表了——这里的电磁信号强度远超安全阈值，而且呈现出某种规律性的脉冲模式，就像……就像有人在用特定的频率向外界发送触发指令。你立刻明白了教室里那台手机自燃的原理——不是电池故障，而是通过特定的网络信号诱导设备过载，进而点燃人体脂肪与水分。 这是一个陷阱，也是一个舞台。 你收回探头，靠在墙壁上整理情报。你知道了地点，知道了手段，甚至看到了背影，但你还没有看到对方的面孔，也不知道他的具体能力边界。更重要的是，你现在贸然闯入，很可能会触发对方预设的防御机制——那些缠绕的线缆和密集的电子设备很可能都是武器。 宫下藤花现在在做什么？ 你的思绪闪过一秒，随即被压制下去。她应该还在教室里，和同学们一起抱怨刚才的骚动，整理被弄乱的笔记，完全不知道几百米外的旧校舍里正在发生什麽。这种隔离让你感到一种冰冷的安心——只要她留在那个绝对安全的日常层，就不会被卷入这场异常。 而你，雾间凪，必须独自面对。 汗水顺着你的额角滑落，不是因为恐惧，而是因为这里的环境温度确实过高。你的制服内衬已经被汗水浸湿，贴在战术背心上。你调整了一下呼吸，感受着陶瓷刀片在袖口滑轨上的冰冷触感。你还不想在这里开战，但至少要确保自己有随时反击的能力。 门后的絮语声突然停止了。 你屏住呼吸，身体瞬间进入预备状态。你听到椅子转动的声音，然后是脚步声，正在向门口靠近。你没有退缩，反而将身体贴得更紧，手指扣住了门边的消防警报器——如果情况失控，你会拉响警报制造混乱，但那是最后的手段。 脚步声在门后停住了。 门把手微微转动，但只是几毫米，随即又停住。似乎是里面的人在检查门锁，或者只是无意的触碰。几秒钟的寂静后，脚步声逐渐远去，回到了房间中央，接着那种絮语声再次响起，变得更加亢奋，像是直播进入了高潮部分。 你缓缓吐出一口气。 你还没有被发现，但你已经确认了目标的存在。那个背影，那个直播间，那种通过关注度引发物理破坏的能力——所有的碎片都在拼凑成一个清晰的图景。这不是偶然事件，而是一场精心策划的"节目"，而整个学校都可能是他的观众席，或者说，素材库。 你需要制定下一步计划。
