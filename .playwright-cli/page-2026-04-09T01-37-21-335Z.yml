            - generic [ref=e150]:
              - article [ref=e151]:
                - paragraph [ref=e152]: 你贴着墙壁滑步移动，脊背与粗糙的混凝土墙面保持着毫米级的空隙，像一把收入鞘中的刀。 午后的阳光在走廊尽头投下斜长的光斑，而你选择的这条路径完全被阴影吞没。汗水从你的下颌滴落，沿着锁骨滑进制服领口，在战术背心上晕开深色的痕迹。这里的空气温度比主走廊高出至少五度，每一口呼吸都带着灼烧肺叶的错觉。你没有抬手擦汗，任何多余的动作都是对这种狩猎节奏的亵渎。 你停在视听室左侧的弱电井门前。门把手上的积灰被你的指尖轻轻抹去，露出下面新鲜的金属光泽——最近有人频繁使用。你单膝跪地，从制服内袋取出微型激光测距仪，红外线在门板上扫过，确认没有物理触发式警报装置。然后你缓缓推开门，锈蚀的合页发出一声几不可闻的呻吟，被旧校舍散热系统的轰鸣完美掩盖。 弱电井内部像是一个被遗弃的血管网络。盘根错节的电缆束沿着墙壁垂直坠落，你戴着手套的指尖掠过那些外皮，通过触感分辨出哪一束是强电，哪一束是数据传输线。某些线缆异常温热，甚至微微震颤，像是有什么巨大的能量正在另一端奔涌。你注意到墙角的通风栅格——那是通向视听室天花板上方的物理通道，栅格上的螺丝有被反复拆卸的痕迹，螺纹边缘泛着金属疲劳的银白色。 你取出一支陶瓷撬棍，动作精确得像是在进行外科手术。螺丝被无声地旋出，你将其按顺序排在地面，像排列某种神秘的符文。栅格移开的瞬间，一股夹杂着臭氧和滚烫硅胶味的热浪扑面而来。你没有退缩，双手撑住边缘，像猫一样轻盈地翻入吊顶夹层。 这里是一个被压缩的黑暗世界。你的腹部紧贴金属龙骨，每一寸移动都伴随着令人牙酸的金属轻微形变声。灰尘在从你头顶漏下的微光中狂舞，你屏住呼吸，从胸前取出光纤探杆，将其小心翼翼地伸向下方格栅的缝隙。便携屏幕上的画面逐帧展开：那是一个由废弃电子设备堆砌而成的巢穴，线缆如藤蔓般从天花板垂落，连接到中央那台被改造过的主机阵列。 你看到了那个背影。他坐在电竞椅上，头部微微前倾，正对着环形排列的显示器说话。他的手势夸张而富有节奏感，每一次抬手都伴随着屏幕上弹幕瀑布的加速滚动。你的目光扫过那些屏幕的反光——那不是普通的游戏直播界面，而是某种被你称为“信号放大器”的定制程序，代码流在背景中以不自然的频率闪烁。 你的视线开始解构这个空间的物理逻辑。主机散热风扇的轰鸣声存在细微的相位差，说明它们连接着不同的供电回路。墙角那台独立的UPS电源体积过大，很可能是改装过的蓄能装置。而那个背影正下方的地板，有轻微的焦黑痕迹，呈现出向外辐射的同心圆图案——和你之前在教室里看到的手机残骸上的灼烧模式完全一致。 你开始在大脑中构建三维地图。通风管道的走向、电缆桥的承重节点、消防喷淋头的覆盖盲区、以及那个身影视线死角的精确角度。你的心跳维持在每分钟五十二下，冷静得像是在解一道几何题。陶瓷刀片在袖口滑轨上贴着手腕，冰冷的触感成为你锚定现实的坐标。 有一瞬间，你的思绪闪过宫下藤花。她现在应该正在教室里，用那种特有的温和笔迹抄写着黑板上的数学公式，完全不知道几百米外的黑暗夹层里，你正像蜘蛛一样倒悬在猎物头顶。这种表里世界的割裂感让你感到一种奇异的安心——只要她留在那个绝对安全的日常层，你的狩猎就有了意义。 光纤镜头捕捉到那个背影突然站起的动作。你瞬间冻结所有肌肉，连瞳孔都保持着静止。他走到墙边，从某处取出一个闪烁着红光的装置，对着它低语了几句，然后重新坐下。你没有听清内容，但你记住了那个装置的位置——那是整个系统的某个关键节点，或许是备用触发器，或许是直播信号的中继器。 你缓缓收回探杆，像收回毒牙的蛇。在撤离之前，你用指尖在最后一段通风管的内壁上刻下三道浅浅的痕迹——这是只有你能识别的标记，代表着“高危险区域，需神经毒素预处理”。金属的凉意渗入指腹，你记住了这里的温度，湿度，以及那种即将被点燃的焦灼气味。 你无声地落回地面，将栅格复位，螺丝旋紧的顺序与拆卸时完全相反。当你重新站在弱电井门外时，夕阳的角度已经改变了三度。你拥有了入侵路径的蓝图，也拥有了摧毁这个巢穴所需的物理坐标。现在，你只需要决定下一步的节奏。
