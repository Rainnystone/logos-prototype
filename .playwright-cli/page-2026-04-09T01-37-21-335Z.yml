                    - generic [ref=e250]: 靠近燃烧现场收集残骸，分析燃烧模式与人为痕迹
                  - paragraph [ref=e251]: 你在混乱中保持冷静，身体比意识更快地做出反应。 当其他学生冲向门口时，你逆着人流走向燃烧现场。空气中弥漫着塑料融化的焦糊味，还夹杂着某种极其细微的——你无法立刻定义——高频信号的残留。粉笔灰和碳化的书页混在一起，你的鞋底踩在满地狼藉的碎屑上，发出细碎的咔嚓声。 你没有立即触碰残骸，而是先用视线完成第一轮扫描。 那台手机的核心芯片已经完全碳化，电路板呈现出不自然的扭曲形态。这种形变不是单纯的电池热失控能够解释的——你见过电池爆炸的痕迹，见过短路引起的起火，但这次不同。熔化的塑料呈现出向外辐射的波纹，就像某种力量在瞬间从内部引爆。 你蹲下身，眯起眼睛。 焦黑的课桌表面还残留着温度，但你不在意这个。你的注意力集中在残骸中的一块线路板上——那里有明显的切割痕迹，不是生产时的工艺切割，而是后被人为划开的细微创口。有人在设备内部做过手脚。 你的手指悬在残骸上方，没有触碰。你能感觉到某种极其微弱的高频振动，像是某种信号传输后的残留频谱。你的制服下藏着微型探测器——那是你从黑市搞来的二手设备，专门用来捕捉异常电磁波。你不确定它的有效性，但这已经是你目前唯一能仰仗的工具。 探测器发出轻微的嗡鸣。 屏幕上跳动的数字让证明你的直觉——这里的电磁残留远超正常电子设备爆炸该有的水平。这不是电池故障，这是一次远程触发。有人在某个地方通过某种方式，让这台手机在特定时刻过载。 你的嘴角微微下沉。 是你的同类？不对。你的感知能力来自一次意外后的变异，你很清楚那种感觉。但眼前这个信号给你一种陌生的违和感——它不像是你熟悉的任何一种能力波动。它更像是—— 你停顿了一秒。 像是被放大的关注度。像是有人刻意在操控舆论和情绪，然后将这种关注转化为物理破坏。 你站起身，目光扫过教室里的每一张面孔。大部分学生还在惊魂未定地议论，只有宫下藤花被老师安置在角落座位上，带着那种近乎迟钝的担忧——她擔心的是下次上课会不会被调换座位，而不是自己的安全问题。她甚至还低头整理了一下刚才慌乱中弄乱的笔记本。 你吐出一口气。 很好，她还是那么安全。 教室外传来消防警报的声音，你的时间不多了。在被人发现你不对劲之前，你必须离开。你最后看了一眼燃烧过的痕迹，然后将探测器的数据导入手机——虽然你不愿意承认，但这东西确实比你的探测器更可靠。 屏幕上显示的信号追踪方向让证明你的猜测——它指向旧校舍的方向。 那里有一废弃视听室你知道。很久以前是学校的電腦教室，后来因为设备老化被废弃，现在是某些不良学生躲藏抽烟的地方。你偶尔路过时听见过里面传出过细微的嗡鸣声，但从未在意过。现在看来，那里可能就是信号源。 你将该路段标记在脑海中，然后若无其事地混进走廊里的人群中。你的步伐很慢，像是在普通地走动，但你的视线已经没有停留在教室里。你需要去旧校舍探查，但你不能表现得太过明显——至少在真正确认之前，你不能暴露感知能力。 因为这可能是陷阱。 你需要做准备。
                - article [ref=e252]:
