                    - generic [ref=e245]: 午后的深阳高中教室内，气氛沉闷而安宁。宫下藤花正在前排认真做笔记，而在教室后排，雾间凪留意到空气里那种不合时宜的躁动。突然，邻座一名普通学生的手机在毫无征兆的情况下发出刺耳的过载蜂鸣，屏幕瞬间爆裂，甚至连带引燃了课桌上的书本。在众人的惊呼与混乱中，雾间凪没有立刻得到完整敌情，只从异常的过载痕迹和被刻意放大的骚动里判断这不是普通事故，并开始一步步查清幕后操控者。
                  - paragraph [ref=e246]: 午后的阳光透过百叶窗切进教室，在课桌上投下细密的光影条纹。粉笔灰轻微飘散，黑板上还残留着数学公式的痕迹。宫下藤花坐在前排，笔尖在笔记本上移动，发出细碎的书写声。这是一种近乎凝固的日常感——连空气都像是被午后慵懒的节奏所浸润。 但你捕捉到了某种不协调的躁动。 那是某种极其细微的高频振动，与教室里的昏昏欲睡格格不入。你的目光扫过周围，学生们有的趴在桌上打盹，有的盯着手机屏幕发愣，没有人注意到这细微的异常。 然后，邻座某人的手机屏幕骤然亮起刺眼的白光。 它发出尖锐的过载蜂鸣，屏幕像被无形力量挤压般爆裂。塑料外壳瞬间变形，电路板暴露在空气中，随即窜出火舌。火焰顺着课桌蔓延，书本的封面在高温下卷曲碳化。 尖叫声像连锁反应一样炸开。 教室陷入混乱。学生们推搡着冲向门口，桌子被撞翻，文具散落一地。老师的声音被淹没在惊慌的浪潮中，只能隐约听见他试图维持秩序的呼喊。宫下藤花被同学拉到一边，脸上写满困惑和紧张——她只把这一切当作电池故障引起的意外。 火势不大，很快就被赶来的值日生用灭火器扑灭。焦黑的课桌上只剩下融化的手机残骸和被熏黑的书本。 事故被定性为普通的手机电池自燃。 没有人意识到这是人为的。 但在那一瞬间，你捕捉到了异常的能量波动——不是电路过载的自然反应，而是某种被刻意放大的信号。你没有惊慌，也没有像其他人那样仓皇逃离。你的第一反应是分析，是追踪。 燃烧的手机残骸中残留着人为的痕迹。 你该采取行动了。
                - article [ref=e247]:
                  - generic [ref=e248]:
