              - generic [ref=e32]: Rising
            - paragraph [ref=e33]: 建立校园日常的基调，随后用突发的手机自燃事件打破平静；雾间凪察觉异常并脱离日常表层，而宫下藤花保持无知。雾间凪此时并不知道灰谷烈的存在，引导雾间凪逐步探索并发现灰谷烈的存在，但并无机会当面对峙。
            - paragraph [ref=e34]:
              - generic [ref=e35]: "Router Hint:"
              - text: 日常/闲暇
            - paragraph [ref=e36]: 手机自燃必须被旁人当作电池事故处理；藤花不能受伤，凪不能当众暴露实力；凪起初不能知道异常元凶，必须通过探索和破解陷阱逐步发现灰谷烈；本阶段不得与灰谷烈正面对峙或战斗。
          - article [ref=e37]:
            - generic [ref=e38]:
              - strong [ref=e39]: Phase 2
              - generic [ref=e40]: Steady
            - paragraph [ref=e41]: 雾间凪在走廊与校园中追踪异常信号，避开人群，发现灰谷烈布置的初步电子陷阱或被操控的痕迹。
            - paragraph [ref=e42]:
              - generic [ref=e43]: "Router Hint:"
              - text: 悬疑/探案
            - paragraph [ref=e44]: 禁止发生正面高强度战斗；追踪手段必须保持物理性，而非感知类超自然侦测。
          - article [ref=e45]:
            - generic [ref=e46]:
              - strong [ref=e47]: Phase 3
              - generic [ref=e48]: Rising
            - paragraph [ref=e49]: 凪突入废弃视听室并遭遇灰谷烈；反派通过屏幕与音响宣告“直播开始”，并利用室内设备发动第一波炎上攻击。
            - paragraph [ref=e50]:
              - generic [ref=e51]: "Router Hint:"
              - text: 惊悚/恐怖
            - paragraph [ref=e52]: 必须先建立灰谷烈的表演型人格与高热封锁，再进入极限闪避；本阶段不得直接秒杀反派。
          - article [ref=e53]:
            - generic [ref=e54]:
              - strong [ref=e55]: Phase 4
              - generic [ref=e56]: Pulse
            - paragraph [ref=e57]: 凪看穿“炎上”机制依托于直播观众的关注度与恐惧感，并以破坏直播设备的方式进行反向压制。
            - paragraph [ref=e58]:
              - generic [ref=e59]: "Router Hint:"
              - text: 博弈/谈判
            - paragraph [ref=e60]: 这里的博弈不等于坐下来辩论；凪的语言必须简短致命，主导动作应是砸毁路由器、摄像头和主控设备。
          - article [ref=e61]:
            - generic [ref=e62]:
              - strong [ref=e63]: Phase 5
              - generic [ref=e64]: Static High
            - paragraph [ref=e65]: 观众人数归零后，“炎上”异能彻底失效；凪近身并以纯粹的物理手段将灰谷烈彻底击倒。
            - paragraph [ref=e66]:
              - generic [ref=e67]: "Router Hint:"
              - text: 动作/战斗
            - paragraph [ref=e68]: 必须先完成断网或观众清零，再进入近身击溃；战斗应呈现单方面碾压感，不允许不吉波普介入。
          - article [ref=e69]:
            - generic [ref=e70]:
              - strong [ref=e71]: Phase 6
              - generic [ref=e72]: Falling
            - paragraph [ref=e73]: 战斗结束后清理现场，凪回到日常线并与宫下藤花重新交汇，确认表里世界的隔离机制仍然成立。
            - paragraph [ref=e74]:
              - generic [ref=e75]: "Router Hint:"
              - text: 日常/闲暇
            - paragraph [ref=e76]: 终局必须完成三项收束：灰谷烈已败、学校表面和平、藤花毫不知情，并保留惊险过后回到乏味日常的余韵。
